[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reportz"
version = "0.1.0"
description = "A Python library"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Gaurav Kadam" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reportz"]
